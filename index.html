<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nishi's Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600;1,800&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--curtain:#5a1420;--curtain2:#3c0c15;--brass:#d9a441;--paper:#f3ead6;--ink:#2a1a14}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--paper);font-family:"Courier Prime",monospace;
 background:repeating-linear-gradient(90deg,var(--curtain) 0 38px,var(--curtain2) 38px 46px,var(--curtain) 46px 70px,#4a101a 70px 76px);
 display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);margin:0;color:var(--brass);text-shadow:0 3px 0 #0006;letter-spacing:.01em}
.sub{margin:6px 0 22px;opacity:.85}
.booth{background:var(--paper);color:var(--ink);padding:16px 16px 18px;border-radius:6px;box-shadow:0 18px 40px #000a,0 0 0 4px var(--brass),0 0 0 7px var(--curtain2);width:min(100%,560px)}
.screen{position:relative;aspect-ratio:4/3;background:#111;overflow:hidden;border-radius:2px}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.vig,.tint{position:absolute;inset:0;pointer-events:none}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay}
#off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:800 italic 9rem Fraunces,serif;color:#fff;text-shadow:0 4px 20px #000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .5s}
@keyframes fl{from{opacity:.95}to{opacity:0}}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#111;color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{font:inherit;font-size:.85rem;padding:7px 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.modes .chip{border-radius:3px}
.btn{font:inherit;font-weight:700;padding:11px 20px;border:0;border-radius:3px;cursor:pointer;background:var(--curtain);color:var(--paper);box-shadow:0 3px 0 var(--curtain2)}
.btn.main{background:var(--brass);color:var(--ink);box-shadow:0 3px 0 #8a6420;font-size:1.05rem}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
#out{display:none;margin-top:26px;text-align:center;width:100%}
#out canvas{max-width:min(100%,420px);max-height:80vh;box-shadow:0 14px 30px #000a;transform:rotate(-1.5deg);background:var(--paper)}
#out .row .btn{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 #0007}
@media (prefers-reduced-motion:reduce){#flash.go{animation:none}}
</style>
</head>
<body>
<h1>Nishi's Photobooth</h1>
<p class="sub">Pick a look, strike a pose.</p>

<main class="booth">
 <div class="screen" id="screen">
  <video id="v" autoplay playsinline muted></video>
  <div class="tint" id="tint"></div>
  <div class="vig" id="vig"></div>
  <div class="grain" id="grain"></div>
  <div id="count"></div><div id="flash"></div>
  <div id="off"><button class="btn main" id="camon">Turn on camera</button></div>
  <div id="msg"></div>
 </div>
 <div class="row modes" id="modes">
  <button class="chip" data-m="single" aria-pressed="true">Single photo</button>
  <button class="chip" data-m="strip" aria-pressed="false">Photo strip of 4</button>
 </div>
 <div class="row" id="filters"></div>
 <div class="row"><button class="btn main" id="snap">📸 Take picture</button><button class="btn" id="camtoggle">Turn camera on</button></div>
</main>

<section id="out" aria-live="polite">
 <canvas id="cv"></canvas>
 <div class="row">
  <button class="btn" id="dl">⬇️ Download</button>
  <button class="btn" id="redo">🔄 Restart</button>
 </div>
</section>

<script>
const FILTERS={
 normal:{n:"Normal",css:"none"},
 sepia:{n:"Sepia",css:"sepia(.9) contrast(1.05)",vig:.35},
 bw:{n:"Black & White",css:"grayscale(1) contrast(1.1)"},
 noir:{n:"Noir",css:"grayscale(1) contrast(1.45) brightness(.9)",vig:.7,grain:.16},
 faded:{n:"Faded 70s",css:"sepia(.3) saturate(1.3) contrast(.88) brightness(1.1) hue-rotate(-10deg)",tint:"rgba(255,190,120,.16)",vig:.3,grain:.1},
 gold:{n:"Kodak Gold",css:"sepia(.25) saturate(1.55) contrast(1.05) brightness(1.05)",tint:"rgba(255,165,50,.14)",vig:.35,grain:.08},
 rose:{n:"Rosé",css:"saturate(1.15) contrast(.92) brightness(1.1) hue-rotate(-14deg)",tint:"rgba(255,150,170,.18)",vig:.25},
 cyan:{n:"Cyanotype",css:"grayscale(1) sepia(1) hue-rotate(180deg) saturate(2.6) contrast(1.1)",vig:.4,grain:.08},
 lomo:{n:"Lomo",css:"saturate(1.7) contrast(1.35)",vig:.85,grain:.1},
 booth:{n:"Old Booth",css:"sepia(1) contrast(.92) brightness(1.06) saturate(.85) blur(1.6px)",tint:"rgba(110,70,30,.2)",vig:.6,grain:.4}
};
const $=id=>document.getElementById(id);
const v=$("v");let cur="normal",mode="single",raws=[],busy=false;

// filter chips
for(const k in FILTERS){const b=document.createElement("button");b.className="chip";b.textContent=FILTERS[k].n;b.dataset.k=k;b.setAttribute("aria-pressed",k===cur);$("filters").append(b)}
$("filters").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cur=k;
 [...$("filters").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===k));preview();if(raws.length)render()};
$("modes").onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;
 [...$("modes").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.m===m))};

const NURL=(()=>{const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d"),d=g.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){const x=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=x;d.data[i+3]=255}g.putImageData(d,0,0);return c.toDataURL()})();
function preview(){const f=FILTERS[cur];v.style.filter=f.css;
 $("grain").style.cssText=f.grain?`background-image:url(${NURL});opacity:${Math.min(1,f.grain*2.5)}`:"background:none";
 $("tint").style.background=f.tint||"none";
 $("vig").style.background=f.vig?`radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,${f.vig}) 100%)`:"none"}

// camera
let stream=null;
const camUI=()=>{$("camtoggle").textContent=stream?"Turn camera off":"Turn camera on"};
async function camOn(){
 if(stream)return true;
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280}},audio:false});
  const ready=new Promise(r=>v.onloadedmetadata=r);
  stream=s;v.srcObject=s;await ready;await v.play().catch(()=>{});
  $("off").style.display="none";$("msg").style.display="none";camUI();return true;
 }catch(e){const m=$("msg");m.style.display="flex";m.textContent="Camera access is blocked. Allow the camera in your browser settings, then try again.";return false}}
function camOff(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 v.srcObject=null;$("off").style.display="flex";camUI()}
const toggleCam=()=>{if(!busy)stream?camOff():camOn()};
$("camon").onclick=$("camtoggle").onclick=toggleCam;
preview();

// capture
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function shoot(){const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 $("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");return c}
$("snap").onclick=async()=>{
 if(busy)return;busy=true;$("snap").disabled=true;
 if(!await camOn()){busy=false;$("snap").disabled=false;return}
 raws=[];$("out").style.display="none";await wait(400);
 const n=mode==="strip"?4:1,cn=$("count");
 for(let i=0;i<n;i++){cn.style.display="flex";
  for(let s=3;s>0;s--){cn.textContent=s;await wait(800)}
  cn.style.display="none";raws.push(await shoot());await wait(500)}
 camOff();busy=false;$("snap").disabled=false;render();
 $("out").style.display="block";$("out").scrollIntoView({behavior:"smooth"})};

// render result
let noise;function grainPattern(ctx){if(!noise){noise=document.createElement("canvas");noise.width=noise.height=160;
 const g=noise.getContext("2d"),d=g.createImageData(160,160);
 for(let i=0;i<d.data.length;i+=4){const x=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=x;d.data[i+3]=255}g.putImageData(d,0,0)}
 return ctx.createPattern(noise,"repeat")}

function drawPhoto(ctx,raw,x,y,w,h,f){
 const s=Math.max(w/raw.width,h/raw.height),sw=w/s,sh=h/s,sx=(raw.width-sw)/2,sy=(raw.height-sh)/2;
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
 ctx.filter=f.css;ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(raw,sx,sy,sw,sh,0,0,w,h);
 ctx.setTransform(1,0,0,1,0,0);ctx.filter="none";
 if(f.tint){ctx.fillStyle=f.tint;ctx.fillRect(x,y,w,h)}
 if(f.grain){ctx.globalAlpha=f.grain;ctx.globalCompositeOperation="overlay";ctx.fillStyle=grainPattern(ctx);ctx.fillRect(x,y,w,h);
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over"}
 if(f.vig){const g=ctx.createRadialGradient(x+w/2,y+h/2,Math.min(w,h)*.35,x+w/2,y+h/2,Math.max(w,h)*.75);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,`rgba(0,0,0,${f.vig})`);ctx.fillStyle=g;ctx.fillRect(x,y,w,h)}
 ctx.restore()}

function render(){
 const f=FILTERS[cur],cv=$("cv"),ctx=cv.getContext("2d"),strip=raws.length>1;
 const W=strip?600:840,pw=strip?480:720,ph=strip?360:720,gap=30,top=strip?50:60,foot=strip?150:260;
 const H=top+raws.length*ph+(raws.length-1)*gap+foot;
 cv.width=W;cv.height=H;
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#f6eedc");bg.addColorStop(1,"#eadfc6");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const px=(W-pw)/2;
 raws.forEach((r,i)=>drawPhoto(ctx,r,px,top+i*(ph+gap),pw,ph,f));
 const d=new Date(),fy=top+raws.length*ph+(raws.length-1)*gap;
 ctx.textAlign="center";ctx.fillStyle="#2a1a14";
 ctx.font=`italic 800 ${strip?40:56}px Fraunces,Georgia,serif`;
 ctx.fillText("Nishi's Photobooth",W/2,fy+(strip?70:110));
 ctx.fillStyle="#c8651b";ctx.font=`${strip?22:28}px "Courier Prime",monospace`;
 ctx.fillText(`'${String(d.getFullYear()).slice(2)}  ${String(d.getMonth()+1).padStart(2,"0")}  ${String(d.getDate()).padStart(2,"0")}`,W/2,fy+(strip?110:165))}

$("dl").onclick=()=>{const a=document.createElement("a");a.download="nishi-photobooth.png";a.href=$("cv").toDataURL("image/png");a.click()};
$("redo").onclick=()=>{raws=[];$("out").style.display="none";window.scrollTo({top:0,behavior:"smooth"})};
</script>
</body>
</html>
